services:
  # --- BACKEND SERVICES ---
  db:
    image: postgres:16
    container_name: educk_db
    environment:
      POSTGRES_DB: educk_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - educk_network

  redis:
    image: redis:7-alpine
    container_name: educk_redis
    ports:
      - "6379:6379"
    networks:
      - educk_network

  educk_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: educk_api
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DB_NAME=educk_db
      - DB_USER=admin
      - DB_PASSWORD=adminpassword
      - DB_HOST=db
    networks:
      - educk_network

  # --- FRONTEND SERVICES ---
  educk_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: educk_frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - educk_network
  nginx:
    image: nginx:alpine
    container_name: educk_nginx
    ports:
      - "80:80"
    volumes:
      - ./gateaway/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./backend/staticfiles:/app/staticfiles
      - ./backend/mediafiles:/app/mediafiles
    depends_on:
      - educk_api
      - educk_frontend
    networks:
      - educk_network
volumes:
  postgres_data:

networks:
  educk_network:
    driver: bridge
