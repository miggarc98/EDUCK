
server {
    listen 80;
    server_name localhost;

    # Frontend (Vite Dev Server con soporte HMR / WebSockets)
    location / {
        proxy_pass http://educk_frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API (Django REST Framework via Gunicorn)
    location /api/ {
        proxy_pass http://educk_api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Opcional para Django: Servir archivos estáticos/media en desarrollo o si usas volume compartido
    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/mediafiles/;
    }
}